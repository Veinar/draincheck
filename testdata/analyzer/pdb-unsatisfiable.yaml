# Cluster for PDB_UNSATISFIABLE, and for its split from PDB_DISRUPTION_BLOCKED.
#
# A budget is unsatisfiable when status.desiredHealthy >= status.expectedPods:
# minAvailable at or above the replica count, or maxUnavailable 0. It can never
# allow a disruption, however healthy the workload is. All pods are Ready unless
# the comment says otherwise. Nodes: worker-01, worker-02.
#
#   a/min-eq        minAvailable 2, 2 pods on worker-01          -> PDB_UNSATISFIABLE
#   b/max-zero      maxUnavailable 0, pods on worker-01 and 02   -> PDB_UNSATISFIABLE (maybe deliberate)
#   c/min-above     minAvailable 5 for 2 pods                    -> PDB_UNSATISFIABLE
#   i/pct           maxUnavailable "0%"                          -> PDB_UNSATISFIABLE
#   d/transient     minAvailable 1, 2 pods, one NOT Ready: 0 allowed now, clears when it is Ready
#                                                                -> PDB_DISRUPTION_BLOCKED only
#   e/stale         unsatisfiable numbers but a stale status     -> PDB_STALE_STATUS only
#   f/operator      unsatisfiable numbers, pod owned by an operator CR
#                                                                -> PDB_DISRUPTION_BLOCKED (UNKNOWN) only
#   g/odd-policy    unsatisfiable numbers, unknown unhealthyPodEvictionPolicy
#                                                                -> PDB_DISRUPTION_BLOCKED (UNKNOWN) only
#   h/ds            unsatisfiable numbers, selects a DaemonSet pod only -> nothing (kubectl skips it)
#   j/ok            minAvailable 1 of 3, 2 allowed               -> nothing
apiVersion: v1
kind: Node
metadata:
  name: worker-01

---
apiVersion: v1
kind: Node
metadata:
  name: worker-02

---
apiVersion: v1
kind: Pod
metadata:
  name: a-0
  namespace: a
  labels:
    app: a
spec:
  nodeName: worker-01
  containers:
    - name: c
      image: example/c:1

---
apiVersion: v1
kind: Pod
metadata:
  name: a-1
  namespace: a
  labels:
    app: a
spec:
  nodeName: worker-01
  containers:
    - name: c
      image: example/c:1

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: min-eq
  namespace: a
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: a
status:
  expectedPods: 2
  desiredHealthy: 2
  currentHealthy: 2
  disruptionsAllowed: 0


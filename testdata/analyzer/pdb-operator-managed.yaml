# Cluster for the operator-managed case of PDB_DISRUPTION_BLOCKED.
#
# An operator creates one PDB per node for its own pods. Each PDB selects one
# pod, has no ownerReferences, and shows 0 allowed disruptions. The pod is
# controlled by the operator's custom resource (controller: true), so the
# group of its owner is not core, apps or batch.
#
# storage-system: operator storage.example.com (NodeAgent), PDBs agent-1-pdb ..
#   agent-4-pdb on worker-01 .. worker-04, one finding for all four.
#   agent-5-pdb on worker-05 allows 1 disruption: nothing to report.
# storage-system-b: the same operator in a second namespace: its own finding.
# block-storage: operator longhorn.io (InstanceManager), which has a more
#   specific remediation text. widgets: operator other.example.org (Widget),
#   which has none and gets the generic text, and a second operator of the same
#   group (Gadget) in the same namespace: a finding of its own.
# twin: one PDB selects a Widget pod and two Gadget pods. It is reported once,
#   under the first of the two kinds (Gadget), with all three pods in evidence.
# shop: PDBs whose pods are controlled by a Deployment (through a ReplicaSet),
#   a StatefulSet, a Job and a ReplicationController: groups apps, apps, batch
#   and core. They stay BLOCKED.
# mixed: one PDB selects a Deployment pod (worker-01) and an operator pod
#   (worker-02): operator-managed when both nodes are targets; only the
#   Deployment pod is evicted when worker-01 alone is.
# outdated: an operator PDB whose status is stale: PDB_STALE_STATUS reports it,
#   not this rule.
#
# Budgets at 0 here have expectedPods one above desiredHealthy (a pod that is not
# counted healthy), so they are state-dependent and stay with PDB_DISRUPTION_BLOCKED;
# the ones that can never allow a disruption are in pdb-unsatisfiable.yaml.

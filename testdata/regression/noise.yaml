# Cluster for the noise regression test (tests/noise_regression_test.go).
#
# It has the shape of the run that motivated the noise work: many replicas
# without requests, DaemonSets on every node, static pods, one operator with a
# budget per node, and a few real problems. Before grouping, every pod was a
# finding of its own. The test holds the grouped result: one finding per cause.
#
# Six nodes, all of them targets, so no node is left for the pods that move:
# one NO_REMAINING_NODES RISK finding for the run. Replicas are spread
# round-robin from worker-01.
#
# shop/web        Deployment, 12 pods, no requests. web-pdb allows 1: one RISK finding (12 pods).
# shop/api        Deployment, 10 pods, no requests. api-pdb allows 1: one RISK finding (10 pods).
# shop/worker     Deployment, 8 pods, memory request missing on one container.
# shop/db         StatefulSet, 3 pods with requests. db-pdb (minAvailable 3 of 3) can never allow a disruption: BLOCKED, PDB_UNSATISFIABLE.
# shop/cache      one pod selected by two budgets (cache-by-app, cache-by-tier).
# shop/queue      Deployment, 2 pods. queue-pdb allows 0 but its status is stale.
# default/debug-shell  a pod with no controller and no requests.
# monitoring      DaemonSet node-exporter, 6 pods. node-exporter-pdb allows 0,
#                 but drain never evicts DaemonSet pods: no finding.
# kube-system     DaemonSet kube-proxy, 6 pods; static pods (etcd and
#                 kube-apiserver mirrors) on worker-01 .. worker-03.
# storage-system  operator storage.example.com (NodeAgent): 4 pods, one budget
#                 each, all allow 0. They are one UNKNOWN finding.

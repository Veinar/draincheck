# GoReleaser configuration. Run by .github/workflows/release.yml on a version tag.
# Go cross-compiles, so all targets build on one Linux runner (CGO disabled).
version: 2

project_name: draincheck

before:
  hooks:
    - go mod verify

builds:
  - id: draincheck
    main: ./cmd/draincheck
    binary: draincheck
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Same program under the name krew and kubectl need (`kubectl drain-check` runs
  # kubectl-drain_check from PATH). plugins/drain-check.yaml points at this binary.
  - id: kubectl-drain_check
    main: ./cmd/draincheck
    binary: kubectl-drain_check
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: draincheck
    ids:
      - draincheck
      - kubectl-drain_check
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign signature over the checksum file. The checksum file lists every archive,
# so one signature covers all artifacts. Output: checksums.txt.sigstore.json (bundle with
# signature, certificate and transparency log entry).
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

release:
  prerelease: auto
  # Created as a draft: the workflow attaches the SLSA provenance and then
  # publishes it. With release immutability enabled, assets cannot be added
  # once a release is published.
  draft: true
